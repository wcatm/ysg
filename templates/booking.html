{% extends "base.html" %}
{% block title %}在线预约 · {{ cfg.site_name }}{% endblock %}
{% block content %}
<div class="wrap page">
  <h1>在线预约</h1>
  <div class="booking-grid">
    <form method="post" class="card form-stack">
      <label>服务项目</label>
      <select name="service_id" id="service" required>
        <option value="">请选择服务项目</option>
        {% for cname, items in cat_services %}
        <optgroup label="{{ cname }}">
          {% for s in items %}
          <option value="{{ s.id }}" data-price="{{ s.price }}" data-duration="{{ s.duration }}"
                  {{ "selected" if pre_service == s.id }}>{{ s.name }}（{{ s.price|yuan }} / {{ s.duration }}分钟）</option>
          {% endfor %}
        </optgroup>
        {% endfor %}
      </select>
      <label>选择技师</label>
      <select name="technician_id" id="tech">
        <option value="">不指定，由门店安排</option>
        {% for t in technicians %}
        <option value="{{ t.id }}">{{ t.name }} · 擅长{{ t.specialties }}</option>
        {% endfor %}
      </select>
      <label>预约日期</label>
      <input type="date" name="bdate" id="bdate" required>
      <label>预约时段</label>
      <div class="slot-grid">
        {% for s in slots %}
        <label class="slot"><input type="radio" name="slot" value="{{ s }}" required> {{ s }}</label>
        {% endfor %}
      </div>
      <label>您的姓名</label>
      <input name="name" value="{{ member.name if member }}" placeholder="如何称呼您" required>
      <label>手机号</label>
      <input name="phone" value="{{ member.phone if member }}" placeholder="11 位手机号"
             pattern="1\d{10}" title="请输入 11 位手机号" required>
      <label>备注（可选）</label>
      <textarea name="remark" rows="2" placeholder="如：想调理的部位、到店时间要求等"></textarea>
      <button class="btn btn-big">提交预约</button>
    </form>
    <aside class="card sum-card">
      <h3>预约信息</h3>
      <p class="muted">确认您的选择</p>
      <div class="sum-row"><span>项目</span><b id="sum-service">未选择</b></div>
      <div class="sum-row"><span>价格</span><b class="price" id="sum-price">—</b></div>
      <div class="sum-row"><span>时长</span><b id="sum-dur">—</b></div>
      <div class="sum-row"><span>技师</span><b id="sum-tech">由门店安排</b></div>
      <hr>
      <p class="muted small">提交后门店会电话与您确认。预约记录可在「预约查询」中查看。</p>
    </aside>
  </div>
</div>
{% endblock %}
