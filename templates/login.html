{% extends "base.html" %}
{% block title %}会员登录 · {{ cfg.site_name }}{% endblock %}
{% block content %}
<div class="wrap page narrow">
  <div class="card auth-card">
    <h1>会员登录</h1>
    <p class="muted">未注册的手机号验证后将自动注册</p>
    <form method="post" class="form-stack">
<input type="hidden" name="_csrf" value="{{ csrf }}">
      <label>手机号</label>
      <input id="phone" name="phone" placeholder="11 位手机号" pattern="1\d{10}" required>
      <label>验证码</label>
      <div class="row-form">
        <input name="code" placeholder="6 位验证码" required>
        <button type="button" class="btn btn-line" id="sendbtn"
                onclick="sendCode({{ shop.id }}, 'sendbtn','phone','hint')">获取验证码</button>
      </div>
      <p class="hint" id="hint"></p>
      <button class="btn btn-big">登录 / 注册</button>
    </form>
  </div>
</div>
{% endblock %}
