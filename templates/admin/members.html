{% extends "admin/base.html" %}
{% block content %}
<h1>会员管理</h1>
<div class="card table-card">
  {% if members %}
  <table>
    <tr><th>手机号</th><th>姓名</th><th>性别</th><th>生日</th><th>注册时间</th><th>预约次数</th></tr>
    {% for m in members %}
    <tr>
      <td>{{ m.phone }}</td>
      <td>{{ m.name or "—" }}</td>
      <td>{{ m.gender or "—" }}</td>
      <td>{{ m.birthday or "—" }}</td>
      <td>{{ m.created_at }}</td>
      <td>{{ m.bcnt }}</td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="muted">暂无会员</p>
  {% endif %}
</div>
{% endblock %}
