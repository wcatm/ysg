<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>门店选择</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<section class="hero">
  <div class="wrap hero-in">
    <p class="hero-eyebrow">康怡养生 · 连锁门店</p>
    <h1>选择门店</h1>
    <p class="hero-sub">每家门店独立服务，请选择您要光临的门店</p>
  </div>
</section>
<div class="wrap page">
  <div class="cards">
    {% for s in shops %}
    <a class="card shop-card" href="{{ url_for('index', shop_id=s.id) }}">
      <span class="brand-mark">養</span>
      <h3>{{ s.name }}</h3>
      <p class="desc">进入门店主页 →</p>
    </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
