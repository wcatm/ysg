<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}管理后台{% endblock %} · {{ cfg.site_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-body">
<div class="admin">
  <aside class="aside">
    <div class="aside-brand"><span class="brand-mark">養</span>{{ cfg.site_name }}<small>管理后台</small></div>
    <nav>
      <a href="/admin/">📊 概览</a>
      <a href="/admin/bookings">📅 预约管理</a>
      <a href="/admin/services">💆 项目管理</a>
      <a href="/admin/technicians">🧑‍⚕️ 技师管理</a>
      <a href="/admin/members">👥 会员管理</a>
      <a href="/admin/config">⚙️ 门店配置</a>
    </nav>
    <a class="aside-foot" href="/admin/logout">退出登录</a>
  </aside>
  <div class="admin-main">
    {% with msgs = get_flashed_messages() %}{% if msgs %}
    <div class="flash">{% for m in msgs %}<p>{{ m }}</p>{% endfor %}</div>
    {% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
